name: Controlled production release

on:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a migration/deployment halfway through. Reject stale SHAs below.
concurrency:
  group: movelle-production-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ghcr.io/aanxnd/movie-recommender:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: true
          sbom: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Verify exact published image
        env:
          IMAGE: ghcr.io/aanxnd/movie-recommender@${{ steps.image.outputs.digest }}
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python scripts/prepare_movielens.py --source data --output data/prepared/smoke
          python scripts/smoke_container.py --image "$IMAGE" --prepared data/prepared/smoke

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      IMAGE: ghcr.io/aanxnd/movie-recommender@${{ needs.publish.outputs.digest }}
      RESOURCE_GROUP: movie-recommender-rg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Reject stale release before cloud changes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Migrate using the exact release image
        timeout-minutes: 7
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          APP_ENV: production
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: bash scripts/migrate_release.sh
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy tested immutable image
        uses: azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          containerAppName: movie-recommender-api
          resourceGroup: movie-recommender-rg
          imageToDeploy: ${{ env.IMAGE }}
