name: Controlled native Azure release

on:
  workflow_dispatch:
    inputs:
      confirm_native_activation:
        description: Final owner-approved controlled activation; production reviews still required
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Never cancel a migration/deployment halfway through. Reject stale SHAs below.
concurrency:
  group: movelle-production-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml

  publish:
    # Owner-directed Azure re-preparation: never publish/deploy the legacy image.
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_native_activation == true }}
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Acquire and verify the existing pinned reference (only after release approval)
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python - <<'PY'
          from pathlib import Path
          from app.bootstrap import ensure_prepared, RELEASE_URL, RELEASE_SHA256
          from app.reference import verify
          path = Path('data/prepared/native-release')
          ensure_prepared(path, RELEASE_URL, RELEASE_SHA256)
          verify(path)
          PY
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/azure/Dockerfile
          platforms: linux/amd64
          build-contexts: reference=data/prepared/native-release
          push: true
          tags: ghcr.io/aanxnd/movie-recommender:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.description=Movelle noncommercial educational/research testing image. MovieLens32M terms and citation are retained in /backend/data/reference/ml-32m-v1/README.txt. Neither the University of Minnesota nor the GroupLens Research Group endorses Movelle. No monetization, advertising, subscriptions, commercial data use or commercial redistribution are authorized for this deployment.
            io.movelle.movielens.license=LicenseRef-MovieLens-32M
            io.movelle.movielens.terms=/backend/data/reference/ml-32m-v1/README.txt
            io.movelle.movielens.citation=https://doi.org/10.1145/2827872
            io.movelle.no-endorsement=Neither the University of Minnesota nor the GroupLens Research Group endorses Movelle.
            io.movelle.usage.scope=Noncommercial educational/research testing only; no monetization, advertising, subscriptions, commercial data use or commercial redistribution are authorized.
      - name: Verify exact published image
        env:
          IMAGE: ghcr.io/aanxnd/movie-recommender@${{ steps.image.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --network none --read-only --entrypoint python "$IMAGE" -m app.reference --prepared /backend/data/reference/ml-32m-v1
          python - <<'PY'
          import json, os, subprocess
          image = os.environ['IMAGE']
          meta = json.loads(subprocess.check_output(['docker', 'image', 'inspect', image]))[0]
          assert meta['Architecture'] == 'amd64' and meta['Config']['Cmd'] == ['python', '-m', 'app.azure_release']
          result = subprocess.run(['docker', 'run', '--rm', '--network', 'none', '--read-only', image], capture_output=True, text=True, timeout=30)
          assert result.returncode != 0 and result.stderr.strip() == 'Azure native startup refused'
          PY

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_native_activation == true }}
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      IMAGE: ghcr.io/aanxnd/movie-recommender@${{ needs.publish.outputs.digest }}
      RESOURCE_GROUP: movie-recommender-rg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Reject stale release before cloud changes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read-only native preflight using the exact release image
        timeout-minutes: 7
        env:
          APP_ENV: production
          MOVELLE_NATIVE_MODE: native-release
          MOVELLE_NATIVE_TARGETS_JSON: ${{ vars.MOVELLE_NATIVE_TARGETS_JSON }}
          MOVELLE_NATIVE_DATABASE_URL: ${{ secrets.NATIVE_RUNTIME_DATABASE_URL }}
          MOVELLE_NATIVE_PUBLISHABLE_KEY: ${{ secrets.NATIVE_PUBLISHABLE_KEY }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: |
          docker pull "$IMAGE"
          name="native-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$name" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=10s 300s docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --entrypoint python \
            --name "$name" \
            -e APP_ENV -e MOVELLE_NATIVE_MODE -e MOVELLE_NATIVE_TARGETS_JSON -e MOVELLE_NATIVE_DATABASE_URL \
            -e MOVELLE_NATIVE_PUBLISHABLE_KEY -e CORS_ALLOWED_ORIGINS "$IMAGE" -m app.native_preflight
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Explicit manual confirmation and protected production reviews are required.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Deploy tested immutable image - approved native configuration and start
        env:
          MOVELLE_NATIVE_TARGETS_JSON: ${{ vars.MOVELLE_NATIVE_TARGETS_JSON }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          MOVELLE_NATIVE_DATABASE_URL: ${{ secrets.NATIVE_RUNTIME_DATABASE_URL }}
          MOVELLE_NATIVE_PUBLISHABLE_KEY: ${{ secrets.NATIVE_PUBLISHABLE_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, tempfile, time
          from pathlib import Path
          from deploy.azure.review import prepare_native_update
          scope = '/subscriptions/b118c1af-4183-49d6-bb49-1b531355fa3f/resourceGroups/movie-recommender-rg/providers/Microsoft.App/containerApps/movie-recommender-api'
          base = 'https://management.azure.com' + scope
          phase = 'read-only preparation'
          try:
              def check(value):
                  if not value: raise ValueError('Native rollout verification failed')
              with tempfile.TemporaryDirectory(prefix='movelle-native-') as directory:
                  def request(method, suffix='', body=None):
                      url = base + suffix + '?api-version=2025-07-01'
                      args = ['az','rest','--method',method,'--url',url,'--only-show-errors','--output','json']
                      if body is not None:
                          path = Path(directory) / 'request.json'
                          with path.open('w',opener=lambda p,f: os.open(p,f,0o600)) as out: json.dump(body,out)
                          args += ['--body','@'+str(path)]
                      result = subprocess.run(args,capture_output=True,text=True)
                      if result.returncode: raise RuntimeError('Azure request failed')
                      return json.loads(result.stdout) if result.stdout.strip() else {}
                  phase = 'read current Azure resource'
                  current = request('get')
                  phase = 'read existing Azure secrets'
                  existing = request('post','/listSecrets')['value']
                  phase = 'validate approved native configuration'
                  patch = prepare_native_update(current,existing,os.environ['IMAGE'],os.environ)
                  # A stopped app may still have an active legacy revision. Never wake it.
                  phase = 'read and validate legacy revision inventory'
                  revisions = request('get','/revisions')['value']
                  old_image = current['properties']['template']['containers'][0]['image']
                  active = [r for r in revisions if r['properties']['active']]
                  for revision in active:
                      name = revision['name']
                      check(re.fullmatch(r'movie-recommender-api--[a-z0-9-]{1,63}',name))
                      check(revision['id'].lower() == (scope+'/revisions/'+name).lower())
                      containers = revision['properties']['template']['containers']
                      check(len(containers) == 1 and containers[0]['image'] == old_image)
                      check(old_image != os.environ['IMAGE'])
                  phase = 'approved retirement of stopped legacy revisions'
                  for revision in active: request('post','/revisions/'+revision['name']+'/deactivate')
                  # Refusal/uncertainty blocks PATCH/start; never change revision mode as a workaround.
                  check(not any(r['properties']['active'] for r in request('get','/revisions')['value']))
                  phase = 'approved native configuration PATCH'
                  request('patch',body=patch)
                  phase = 'bounded native revision verification'
                  for attempt in range(120):
                      current = request('get'); p = current['properties']
                      if p.get('provisioningState') == 'Failed': raise RuntimeError('Provisioning failed')
                      if p.get('provisioningState') == 'Succeeded': break
                      time.sleep(2)
                  else: raise RuntimeError('Provisioning remained uncertain')
                  container = p['template']['containers'][0]
                  check(container['image'] == os.environ['IMAGE'] and p['template']['scale']['maxReplicas'] == 1)
                  actual = {r['name']:{k:v for k,v in r.items() if v is not None} for r in container['env']}
                  wanted = {r['name']:r for r in patch['properties']['template']['containers'][0]['env']}
                  check(actual == wanted)
                  phase = 'explicit native start'
                  if p['runningStatus'] == 'Stopped': request('post','/start')
                  elif p['runningStatus'] != 'Running': raise RuntimeError('Unexpected running state')
              print('Native configuration verified; controlled startup requested; perform bounded acceptance before frontend promotion')
          except Exception:
              raise SystemExit('Native deployment stopped during '+phase+'; inspect state; no automatic retry or restore') from None
          PY
