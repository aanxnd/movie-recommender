name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: disposable
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d disposable" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://test:disposable-ci-only@127.0.0.1:5432/disposable?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Prepare repository MovieLens Small offline
        run: python scripts/prepare_movielens.py --source data --output data/prepared/latest-small-v1
      - name: Verify prepared application startup
        env:
          MOVIELENS_PREPARED_DIR: data/prepared/latest-small-v1
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          from app.historical import PreparedHistoricalData
          with TestClient(app) as client:
              assert isinstance(app.state.historical_users, PreparedHistoricalData)
              assert client.get('/health').json() == {'status': 'ok'}
          PY
      - name: Run complete pytest suite
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Test frontend API routing
        run: npm test
