name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare repository MovieLens Small offline
        run: python scripts/prepare_movielens.py --source data --output data/prepared/latest-small-v1
      - name: Verify prepared application startup
        env:
          MOVIELENS_PREPARED_DIR: data/prepared/latest-small-v1
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          from app.historical import PreparedHistoricalData
          with TestClient(app) as client:
              assert isinstance(app.state.historical_users, PreparedHistoricalData)
              assert client.get('/health').json() == {'status': 'ok'}
          PY
      - name: Run complete pytest suite
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
