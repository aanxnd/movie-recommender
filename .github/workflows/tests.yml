name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-arm64:
    name: Native ARM64 validation
    # Standard public runners are free. Do not consume private-repo paid minutes.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify native ARM dependencies and offline computation
        run: |
          test "$(uname -m)" = aarch64
          python -m pytest -q -p no:cacheprovider tests/test_historical.py tests/test_recommender.py tests/test_supabase_jwt.py tests/test_oracle_image.py tests/test_oracle_deployment.py
          docker build -f deploy/oracle/Dockerfile -t movelle-oracle:arm-ci .
          docker run --rm --network none --entrypoint python movelle-oracle:arm-ci -c "import platform,numpy,pandas,psycopg,cryptography,app.native_release; assert platform.machine() == 'aarch64'; print('Native ARM imports passed')"
      - name: Check proposed proxy on fictional loopback TLS only
        run: |
          docker pull nginx:stable-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
          python scripts/check_oracle_proxy.py
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: disposable
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d disposable" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://test:disposable-ci-only@127.0.0.1:5432/disposable?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Prepare repository MovieLens Small offline
        run: python scripts/prepare_movielens.py --source data --output data/prepared/latest-small-v1
      - name: Verify prepared application startup
        env:
          MOVIELENS_PREPARED_DIR: data/prepared/latest-small-v1
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          from app.historical import PreparedHistoricalData
          with TestClient(app) as client:
              assert isinstance(app.state.historical_users, PreparedHistoricalData)
              assert client.get('/health').json() == {'status': 'ok'}
          PY
      - name: Run complete pytest suite
        run: python -m pytest -q -p no:cacheprovider
      - name: Build native Oracle image and verify unapproved startup is refused
        run: |
          docker build -f deploy/oracle/Dockerfile -t movelle-oracle:ci .
          python - <<'PY'
          import subprocess
          result = subprocess.run(['docker', 'run', '--rm', '--network', 'none', '--read-only',
              '--cap-drop=ALL', '--security-opt=no-new-privileges', '--pids-limit=128',
              '--tmpfs', '/tmp:rw,noexec,nosuid,size=64m', 'movelle-oracle:ci'],
              capture_output=True, text=True, timeout=30)
          assert result.returncode != 0
          assert result.stderr.strip() == 'Oracle native startup refused'
          print('Native Oracle image refused unapproved startup without network')
          PY
      - name: Validate native Azure AMD64 runtime without publishing
        run: |
          docker build --platform linux/amd64 --target runtime -f deploy/azure/Dockerfile -t movelle-azure:ci .
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          meta = json.loads(subprocess.check_output(['docker', 'image', 'inspect', 'movelle-azure:ci']))[0]
          assert meta['Architecture'] == 'amd64' and meta['Config']['User'] == '10001:10001'
          probe = Path('scripts/check_native_ca.py').read_text()
          command = ['docker', 'run', '--rm', '-i', '--network', 'none', '--read-only',
              '--cap-drop=ALL', '--security-opt=no-new-privileges', '--entrypoint', 'python']
          valid = subprocess.run(command + ['movelle-azure:ci', '-'], input=probe,
              capture_output=True, text=True, timeout=30)
          assert valid.returncode == 0, 'Native image CA trust is unavailable'
          missing = subprocess.run(command + ['-e', 'SSL_CERT_FILE=/missing-ca-bundle',
              '-e', 'SSL_CERT_DIR=/missing-ca-directory', 'movelle-azure:ci', '-'],
              input=probe, capture_output=True, text=True, timeout=30)
          assert missing.returncode != 0 and missing.stderr.strip() == 'Native CA trust check refused'
          print('Native bundled-libpq CA regression passed, including missing-store rejection')
          result = subprocess.run(['docker', 'run', '--rm', '--network', 'none', '--read-only',
              '--cap-drop=ALL', '--security-opt=no-new-privileges', 'movelle-azure:ci'],
              capture_output=True, text=True, timeout=30)
          assert result.returncode != 0 and result.stderr.strip() == 'Azure native startup refused'
          print('AMD64 runtime refused unapproved configuration; no reference or cloud calls')
          PY

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Build isolated staging frontend
        env:
          VITE_STAGING_SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
          VITE_STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_offline
        run: npm run build:staging
      - name: Test frontend API routing
        run: npm test
      - name: Verify isolated native release artifact offline
        run: node scripts/check-native-build.mjs

  staging-browser:
    name: Staging browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: disposable
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d disposable" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://test:disposable-ci-only@127.0.0.1:5432/disposable?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install isolated Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
      - name: Install locked browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chrome
      - name: Test real staging frontend, API and PostgreSQL with fictional Auth
        working-directory: frontend
        run: npx playwright test --config playwright.staging.config.js
      - name: Test complete default browser suite offline
        working-directory: frontend
        run: npx playwright test
      - name: Test isolated profile provisioning offline
        working-directory: frontend
        run: npx playwright test --config playwright.provisioning.config.js
