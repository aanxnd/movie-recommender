# Fill only after resource/cost/target approval; placeholders must not be deployed.
type: Microsoft.App/containerApps
name: movie-recommender-api-private
location: canadacentral
properties:
  environmentId: __APPROVED_EXISTING_ENVIRONMENT_RESOURCE_ID__
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      allowInsecure: false
      targetPort: 8000
      transport: http
    secrets:
      - name: private-gate
        value: __PRIVATE_INPUT_NEVER_COMMIT__
      - name: private-database
        value: __PRIVATE_INPUT_NEVER_COMMIT__
      - name: dev-publishable
        value: __PRIVATE_INPUT_NEVER_COMMIT__
  template:
    containers:
      - name: movelle-private
        image: __REVIEWED_GHCR_IMAGE_AT_SHA256_DIGEST__
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: MOVELLE_PRIVATE_MODE
            value: private-stage23
          - name: CORS_ALLOWED_ORIGINS
            value: __EXACT_APPROVED_FRONTEND_HTTPS_ORIGIN__
          - name: MOVELLE_PRIVATE_GATE_SECRET
            secretRef: private-gate
          - name: MOVELLE_PRIVATE_DATABASE_URL
            secretRef: private-database
          - name: MOVELLE_PRIVATE_PUBLISHABLE_KEY
            secretRef: dev-publishable
        probes:
          - type: Startup
            tcpSocket: { port: 8000 }
            periodSeconds: 5
            failureThreshold: 30
          - type: Liveness
            tcpSocket: { port: 8000 }
            periodSeconds: 30
    scale:
      minReplicas: 0
      maxReplicas: 1
